<div class="future-fullscreen" id="futureBoard">
    <div class="future-overlay"></div>
    <div class="future-content" data-animate>
        <div class="future-icon">✦</div>
        <h1 class="future-title">从这里走向世界</h1>

        <div class="future-quote-group">
            <p class="future-quote">“技术是工具，表达是目的，动手是连接两者的桥梁。”</p>
            <p class="future-quote">“这条路由无数个『动手』的瞬间铺成。”</p>
            <p class="future-quote">“不定义边界，只定义行动。”</p>
        </div>

        <div class="future-line"></div>

        <div class="future-outlook">
            <p>代码会继续写下去，视频会继续剪下去。</p>
            <p>安全会继续研究，硬件会继续拆解，设计会继续打磨。</p>
            <p>五条线还在往前走，有些会合拢，有些会断开，</p>
            <p>有些会走到更远的地方。</p>
            <p style="margin-top:10px;font-weight:500;letter-spacing:2px;color:#f0e6d0;">
                无所谓哪条是“主路”，能往前走的路，就是值得走的路。
            </p>
        </div>

        <div class="future-line"></div>
        <p class="future-meta">华西综合科技运用与研究中心 · 2026</p>
    </div>
</div>

<!-- ============================================================
GSAP 淡入动画（时间拉长）
============================================================ -->
<script>
    (function() {
        function initAnimation() {
            if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') {
                setTimeout(initAnimation, 200);
                return;
            }

            gsap.registerPlugin(ScrollTrigger);

            var el = document.querySelector('#futureBoard .future-content');
            if (!el) return;

            gsap.set(el, { opacity: 0, y: 30 });

            gsap.to(el, {
                opacity: 1,
                y: 0,
                duration: 1.6,
                ease: 'power2.out',
                scrollTrigger: {
                    trigger: el,
                    start: 'top 88%',
                    toggleActions: 'play none none none',
                    once: true
                }
            });

            ScrollTrigger.refresh();
        }

        if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
            initAnimation();
        } else {
            document.addEventListener('DOMContentLoaded', function() {
                setTimeout(initAnimation, 300);
            });
        }
    })();
</script>
